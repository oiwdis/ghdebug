name: Edge
on:
  push:
  workflow_dispatch:
jobs:
  matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        n: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - name: expr + working-directory
        working-directory: sub
        env:
          GREETING: hi-${{ matrix.n }}
        run: |
          echo "n=${{ matrix.n }} greeting=$GREETING pwd=$(pwd) from_cli=$FROM_CLI"
          ls file.txt
          echo 'quote test: "$HOME" stays literal in single quotes'
      - name: python step
        shell: python
        run: |
          import os
          print("python sees GREETING?", os.environ.get("GREETING"), "n=${{ matrix.n }}")
      - name: pipefail bash
        shell: bash
        run: |
          false | true
          echo "pipefail did not trigger?!"
  uses-fail:
    runs-on: ubuntu-latest
    steps:
      - run: echo "before"
      - uses: actions/github-script@v7
        with:
          script: core.setFailed("deliberate failure in a uses step")
